# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 0.10.0

package:
  name: taplo
  version: ${{ version }}

source:
  url: https://github.com/tamasfe/taplo/archive/refs/tags/release-taplo-cli-${{ version }}.tar.gz
  sha256: eaec8435bfb5ccd89f7b4dd09385b6be25c2ff00aa25417cb82c88a59d4ccde0

build:
  number: 2
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - if: ppc64le
        then:
          # Rust 1.90 uses lld by default and has issue linking to conda libraries
          # compiled with newer gcc
          - export RUSTFLAGS="$RUSTFLAGS -C link-arg=-fuse-ld=bfd"
      - if: unix
        then:
          - export OPENSSL_DIR="${PREFIX}"
          - cargo auditable install --locked --features lsp,rustls-tls --no-track --bins --root ${{ PREFIX }} --path crates/taplo-cli
        else:
          - cargo auditable install --locked --features lsp,rustls-tls --no-track --bins --root %LIBRARY_PREFIX% --path crates\taplo-cli
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler("rust") }}
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - cargo-bundle-licenses
    - cargo-auditable
  host:
    - if: unix
      then:
        - openssl

tests:
  - requirements:
      run:
        - if: win
          then: m2-grep
    script:
      - taplo --version
      - taplo --help
      - taplo --version | grep -iE "taplo ${{ version | replace(".", "\\.") }}"
  - package_contents:
      bin:
        - taplo
      strict: true

about:
  license: MIT
  summary: A TOML toolkit written in Rust
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/tamasfe/taplo

extra:
  recipe-maintainers:
    - bollwyvl
